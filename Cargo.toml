[package]
name = "gxdm-emergency-mode"
version = "1.0.0"
edition = "2024"
# ratatui 0.30 and its dependencies need Rust 1.88.
rust-version = "1.88"

[dependencies]
crossterm = "0.29"
libc = "0.2.189"
nix = { version = "0.31.3", features = ["user", "term", "process", "signal", "fs"] }
pam-client = { version = "0.5.0", default-features = false }
ratatui = "0.30.2"
signal-hook = "0.4.4"
zeroize = "1.9.0"
